[project]
name = "pangea-agent"
version = "0.1.0"
description = "Codetalks Skill runtime and local test-analysis asset manager"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pydantic>=2,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-lua>=0.5,<0.6",
]

[project.scripts]
pangea = "pangea_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pangea_agent.rubrics" = ["builtin/*.md"]
"pangea_agent" = ["skill_packages/codetalks-skill/**/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

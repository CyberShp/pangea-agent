[project]
name = "pangea-agent"
version = "0.1.0"
description = "LangGraph-style testing analysis agent skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.0",
]

[project.scripts]
pangea = "pangea_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
